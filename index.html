<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅の冒険の書</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
<header class="app-header"><h1 class="app-title">旅の冒険の書</h1></header>
<main id="main-content">
<section id="tab-home" class="tab-panel active">
<div class="status-window">
<div class="status-row"><span class="status-label">Lv</span><span class="status-value" id="st-lv">1</span></div>
<div class="status-row"><span class="status-label">制覇した町</span><span class="status-value" id="st-towns">0</span></div>
<div class="status-row"><span class="status-label">場所</span><span class="status-value" id="st-places">0</span></div>
<div class="status-row"><span class="status-label">たからもの</span><span class="status-value" id="st-treasure">0</span></div>
<div class="exp-bar-wrap"><div class="exp-bar" id="st-expbar"></div></div>
<div class="exp-text" id="st-exptext">次のレベルまで 0 / 100</div>
</div>
<div class="slime-guide"><div class="slime-icon">🐍</div><div id="slime-msg">ようこそ！</div></div>
<div class="section-box"><div class="section-title">🎒 冒険中の旅</div><div id="home-trips"></div></div>
<div class="section-box"><div class="section-title">📝 最近の記録</div><div id="home-recent"></div></div>
<div class="section-box"><div class="section-title">🗺️ 制覇コーナー</div>
<div class="conquest-summary"><div><span class="big-num" id="st-towns2">0</span><span class="unit">町</span></div>
<div class="conquest-pref" id="pref-progress"></div></div>
</div>
</section>
<section id="tab-map" class="tab-panel">
<div class="map-toolbar">
<button class="map-tool-btn" id="btn-rulora" type="button">🌍 ルーラ</button>
<button class="map-tool-btn" id="btn-sakusen" type="button">🔍 さくせん</button>
</div>
<div id="map-container">
<div id="map"></div>
<div id="map-status" class="map-status">地図を読み込み中…</div>
<div id="panel-rulora" class="map-panel hidden">
<div class="map-panel-title"><span>ルーラ</span><button class="map-panel-close" data-close type="button">×</button></div>
<div class="pref-grid" id="pref-grid"></div>
</div>
<div id="panel-sakusen" class="map-panel hidden">
<div class="map-panel-title"><span>さくせん</span><button class="map-panel-close" data-close type="button">×</button></div>
<div class="filter-group"><div class="filter-label">カテゴリ</div><div class="filter-chips" id="filter-categories"></div></div>
<div class="filter-group"><div class="filter-label">その他</div><div class="filter-chips">
<button class="chip" data-filter="wantAgain" type="button">また行きたいだけ</button>
<button class="chip" data-filter="treasure" type="button">たからものがある</button>
</div></div>
<div class="filter-actions">
<button class="dq-button secondary" id="btn-filter-reset" type="button">リセット</button>
<button class="dq-button" id="btn-filter-apply" type="button">適用</button>
</div>
</div>
</div>
</section>
<section id="tab-quest" class="tab-panel">
<div class="section-box">
<div class="section-title">🍺 ルイーダの酒場</div>
<button class="dq-button" id="btn-new-trip" type="button">新しい旅を作る</button>
</div>
<div class="section-box"><div class="section-title" id="quest-section-title">冒険の一覧</div><div id="quest-list"></div></div>
</section>
<section id="tab-zukan" class="tab-panel">
<div class="section-box"><div class="section-title">🎁 アイテム図鑑</div><div id="zukan-list"></div></div>
</section>
</main>
<nav class="tab-bar">
<button class="tab-btn active" data-tab="home" type="button"><span class="tab-icon">🏠</span><span class="tab-label">ホーム</span></button>
<button class="tab-btn" data-tab="map" type="button"><span class="tab-icon">🗺️</span><span class="tab-label">地図</span></button>
<button class="tab-btn" data-tab="quest" type="button"><span class="tab-icon">⚔️</span><span class="tab-label">旅</span></button>
<button class="tab-btn" data-tab="zukan" type="button"><span class="tab-icon">📖</span><span class="tab-label">図鑑</span></button>
</nav>
<button class="fab" id="btn-record" type="button">＋</button>
</div>
<div id="modal-record" class="modal hidden">
<div class="modal-content">
<div class="modal-header"><span>⛪ 教会で きろくする</span><button class="modal-close" id="btn-close-record" type="button">×</button></div>
<div class="modal-body">
<div class="form-group"><label class="form-label">旅</label><select class="form-select" id="f-trip"></select></div>
<div class="form-group"><label class="form-label">場所の名前 *</label><input class="form-input" id="f-name" type="text" placeholder="例：横浜中華街"></div>
<div class="form-group"><label class="form-label">カテゴリ</label><select class="form-select" id="f-cat"></select></div>
<div class="form-row">
<div class="form-group"><label class="form-label">緯度</label><input class="form-input" id="f-lat" type="text" placeholder="35.45" inputmode="decimal"></div>
<div class="form-group"><label class="form-label">経度</label><input class="form-input" id="f-lng" type="text" placeholder="139.64" inputmode="decimal"></div>
</div>
<div class="form-group"><label class="form-label">評価</label>
<div class="star-pick" id="f-stars">
<button type="button" class="star-btn" data-s="1">★</button>
<button type="button" class="star-btn" data-s="2">★★</button>
<button type="button" class="star-btn on" data-s="3">★★★</button>
</div></div>
<label class="check-row"><input type="checkbox" id="f-want"> また行きたい</label>
<div class="form-group"><label class="form-label">メモ</label><textarea class="form-textarea" id="f-note"></textarea></div>
<div class="section-title" style="margin-top:8px">🎁 お土産（任意）</div>
<div class="form-group"><label class="form-label">品名</label><input class="form-input" id="f-item" type="text"></div>
<label class="check-row"><input type="checkbox" id="f-treasure"> たからもの</label>
<button class="dq-button" id="btn-save-record" type="button" style="margin-top:16px">冒険の書に記録する</button>
</div></div></div>
<div id="modal-trip" class="modal hidden">
<div class="modal-content">
<div class="modal-header"><span>🍺 新しい旅</span><button class="modal-close" id="btn-close-trip" type="button">×</button></div>
<div class="modal-body">
<div class="form-group"><label class="form-label">旅の名前 *</label><input class="form-input" id="t-name" type="text"></div>
<div class="form-group"><label class="form-label">開始日</label><input class="form-input" id="t-date" type="date"></div>
<button class="dq-button" id="btn-save-trip" type="button">旅を作る</button>
</div></div></div>
<div id="modal-detail" class="modal hidden">
<div class="modal-content">
<div class="modal-header"><span id="detail-title">場所の詳細</span><button class="modal-close" id="btn-close-detail" type="button">×</button></div>
<div class="modal-body" id="detail-body"></div>
</div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
