<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅の冒険の書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=10">
</head>
<body data-tab="home">
<div id="app">
<header class="app-header"><img class="title-slime" src="assets/slime.png" alt="" onerror="this.style.display='none'"><h1 class="app-title"><img class="title-img" src="assets/text_title.png" alt="旅の冒険の書"></h1></header>
<main id="main-content">
<section id="tab-home" class="tab-panel active">
<div class="home-screen"><img class="home-screen-img" src="assets/home_all.jpg?v=11" alt="" onerror="this.style.display='none'">
<div class="hs-num" id="st-lv" style="top:23.18%">1</div>
<div class="hs-num" id="st-towns" style="top:25.00%">0</div>
<div class="hs-num" id="st-places" style="top:26.93%">0</div>
<div class="hs-num" id="st-treasure" style="top:28.91%">0</div>
<div class="hs-expbar"><div class="expbar-fill" id="st-expbar"></div></div>
<div class="hs-exptext"><img src="assets/text_next.png" alt="つぎのレベルまで"><span id="st-exptext">あと 100</span></div>
<div class="hs-list" id="home-trips" style="top:50.5%"></div>
<div class="hs-list" id="home-recent" style="top:60.5%"></div>
<div class="hs-towns"><span id="st-towns2">0</span><span class="hs-unit">町</span></div>
<div class="hs-prefs" id="pref-progress"></div>
<button class="art-btn" id="btn-conquest-open" type="button" aria-label="制覇マップを見る" style="left:31.5%;top:78.61%;width:37.5%;height:2.99%"></button>
<button class="art-btn" id="btn-export" type="button" aria-label="データを書き出す（バックアップ）" style="left:26.5%;top:87.77%;width:47%;height:2.96%"></button>
<button class="art-btn" id="btn-import" type="button" aria-label="データを読み込む" style="left:26.5%;top:90.69%;width:47%;height:2.26%"></button>
<input type="file" id="file-import" accept=".json,application/json" style="display:none">
<button class="art-btn" id="btn-wipe" type="button" aria-label="全データを消す" style="left:26.5%;top:93.14%;width:47%;height:2.48%"></button>
</div>
<div class="slime-guide"><div class="slime-icon"><img class="slime-img" src="assets/homita.png?v=3" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="slime-emoji" style="display:none">🩵</span></div><div id="slime-msg">ようこそ！</div></div>
<div class="lower-hints"><div class="mini-map-hint">町の数は、場所の「市区町村」から数えています。未入力の場所は数に入りません。</div>
<div class="mini-map-hint">記録はこの端末の中（localStorage）に保存されています。機種変更やGAS移植の前に、書き出しを残してください。</div></div>
</section>
<section id="tab-map" class="tab-panel">
<div class="map-toolbar">
<button class="map-tool-btn" id="btn-rulora" type="button">🌍 ルーラ</button>
<button class="map-tool-btn" id="btn-sakusen" type="button">🔍 さくせん</button>
</div>
<div id="map-container">
<div id="map"></div>
<div id="map-status" class="map-status">地図を読み込み中…</div>
<div id="route-banner" class="route-banner hidden"></div>
<div id="panel-rulora" class="map-panel hidden">
<div class="map-panel-title"><span>ルーラ</span><button class="map-panel-close" data-close type="button">×</button></div>
<div class="pref-grid" id="pref-grid"></div>
</div>
<div id="panel-sakusen" class="map-panel hidden">
<div class="map-panel-title"><span>さくせん</span><button class="map-panel-close" data-close type="button">×</button></div>
<div class="filter-group"><div class="filter-label">名前で探す</div><input class="form-input" id="filter-q" type="text" placeholder="場所の名前"></div>
<div class="filter-group"><div class="filter-label">旅</div><select class="form-select" id="filter-trip"><option value="">すべての旅</option></select></div>
<div class="filter-group"><div class="filter-label">カテゴリ</div><div class="filter-chips" id="filter-categories"></div></div>
<div class="filter-group"><div class="filter-label">その他</div><div class="filter-chips">
<button class="chip" data-filter="wantAgain" type="button">また行きたいだけ</button>
<button class="chip" data-filter="treasure" type="button">たからものがある</button>
</div></div>
<div class="filter-actions">
<button class="dq-button secondary" id="btn-filter-reset" type="button">リセット</button>
<button class="dq-button" id="btn-filter-apply" type="button">適用</button>
</div>
</div>
</div>
</section>
<section id="tab-quest" class="tab-panel">
<div class="section-box">
<div class="section-title">🍺 ルイーダの酒場</div>
<button class="dq-button" id="btn-new-trip" type="button">新しい旅を作る</button>
</div>
<div class="section-box"><div class="section-title" id="quest-section-title">冒険の一覧</div><div id="quest-list"></div></div>
</section>
<section id="tab-zukan" class="tab-panel">
<div class="section-box"><div class="section-title">🎁 アイテム図鑑</div>
<div class="zukan-count" id="zukan-count"></div>
<div class="filter-chips zukan-filters" id="zukan-filters">
<button class="chip active" data-zfilter="all" type="button">すべて</button>
<button class="chip" data-zfilter="treasure" type="button">たからものだけ</button>
<button class="chip" data-zfilter="metal" type="button">メタル級だけ</button>
</div>
<div id="zukan-list"></div></div>
</section>
</main>
<nav class="tab-bar">
<button class="tab-btn active" data-tab="home" type="button"><span class="tab-icon">🏠</span><span class="tab-label">ホーム</span></button>
<button class="tab-btn" data-tab="map" type="button"><span class="tab-icon">🗺️</span><span class="tab-label">地図</span></button>
<button class="tab-btn" data-tab="quest" type="button"><span class="tab-icon">⚔️</span><span class="tab-label">旅</span></button>
<button class="tab-btn" data-tab="zukan" type="button"><span class="tab-icon">📖</span><span class="tab-label">図鑑</span></button>
</nav>
<button class="fab" id="btn-record" type="button">きろくする</button>
</div>
<div id="modal-record" class="modal hidden">
<div class="modal-content">
<div class="modal-header"><span>⛪ 教会で きろくする</span><button class="modal-close" id="btn-close-record" type="button">×</button></div>
<div class="modal-body">
<div class="form-group"><label class="form-label">旅</label><select class="form-select" id="f-trip"></select></div>
<div class="form-group"><label class="form-label">場所の名前 *</label><input class="form-input" id="f-name" type="text" placeholder="例：横浜中華街"></div>
<div class="form-group"><label class="form-label">カテゴリ</label><select class="form-select" id="f-cat"></select></div>
<div class="form-row">
<div class="form-group"><label class="form-label">緯度</label><input class="form-input" id="f-lat" type="text" placeholder="35.45" inputmode="decimal"></div>
<div class="form-group"><label class="form-label">経度</label><input class="form-input" id="f-lng" type="text" placeholder="139.64" inputmode="decimal"></div>
</div>
<div class="form-group"><label class="form-label">行った日</label><input class="form-input" id="f-date" type="date"></div>
<div class="form-row">
<div class="form-group"><label class="form-label">都道府県</label><select class="form-select" id="f-pref"></select></div>
<div class="form-group"><label class="form-label">市区町村（制覇に数えます）</label><input class="form-input" id="f-city" type="text" placeholder="例：青梅市"></div>
</div>
<div class="form-group"><label class="form-label">住所</label><input class="form-input" id="f-address" type="text" placeholder="例：東京都青梅市…"></div>
<div class="form-group"><label class="form-label">紹介URL</label><input class="form-input" id="f-url" type="url" placeholder="https://…"></div>
<div class="form-group"><label class="form-label">写真URL（1行に1つ・任意）</label><textarea class="form-textarea" id="f-photos" placeholder="Googleフォト等でコピーした画像URLを貼れます"></textarea></div>
<div class="form-group"><label class="form-label">評価</label>
<div class="star-pick" id="f-stars">
<button type="button" class="star-btn" data-s="1">★</button>
<button type="button" class="star-btn" data-s="2">★★</button>
<button type="button" class="star-btn on" data-s="3">★★★</button>
</div></div>
<label class="check-row"><input type="checkbox" id="f-want"> また行きたい</label>
<div class="form-group"><label class="form-label">メモ</label><textarea class="form-textarea" id="f-note"></textarea></div>
<div class="section-title" style="margin-top:8px">🎁 お土産（任意）</div>
<div class="form-group"><label class="form-label">品名</label><input class="form-input" id="f-item" type="text"></div>
<label class="check-row"><input type="checkbox" id="f-treasure"> たからもの</label>
<button class="dq-button" id="btn-save-record" type="button" style="margin-top:16px">冒険の書に記録する</button>
</div></div></div>
<div id="modal-trip" class="modal hidden">
<div class="modal-content">
<div class="modal-header"><span id="trip-modal-title">🍺 新しい旅</span><button class="modal-close" id="btn-close-trip" type="button">×</button></div>
<div class="modal-body">
<div class="form-group"><label class="form-label">旅の名前 *</label><input class="form-input" id="t-name" type="text"></div>
<div class="form-group"><label class="form-label">種類</label><select class="form-select" id="t-type">
<option value="家族旅行">家族旅行</option><option value="出張">出張</option><option value="日帰り">日帰り</option><option value="その他">その他</option>
</select></div>
<div class="form-row">
<div class="form-group"><label class="form-label">開始日</label><input class="form-input" id="t-date" type="date"></div>
<div class="form-group"><label class="form-label">終了日</label><input class="form-input" id="t-end" type="date"></div>
</div>
<div class="form-group"><label class="form-label">パーティ（一緒に行った人）</label><div class="party-checks" id="t-party"></div></div>
<div class="form-group"><label class="form-label">Googleフォト アルバムURL</label><input class="form-input" id="t-album" type="url" placeholder="https://photos.app.goo.gl/…"></div>
<div class="form-group"><label class="form-label">メモ</label><textarea class="form-textarea" id="t-note"></textarea></div>
<button class="dq-button" id="btn-save-trip" type="button">旅を作る</button>
<button class="dq-button danger hidden" id="btn-delete-trip" type="button" style="margin-top:8px">この旅を削除する</button>
</div></div></div>
<div id="modal-item" class="modal hidden">
<div class="modal-content">
<div class="modal-header"><span>🎁 お土産を編集</span><button class="modal-close" id="btn-close-item" type="button">×</button></div>
<div class="modal-body">
<div class="form-group"><label class="form-label">買った場所</label><div class="form-static" id="i-place">（なし）</div></div>
<div class="form-group"><label class="form-label">品名 *</label><input class="form-input" id="i-name" type="text"></div>
<div class="form-group"><label class="form-label">カテゴリ</label><select class="form-select" id="i-cat"></select></div>
<div class="form-row">
<div class="form-group"><label class="form-label">金額（円・参考）</label><input class="form-input" id="i-price" type="number" inputmode="numeric" min="0" placeholder="例：1200"></div>
<div class="form-group"><label class="form-label">誰用か</label><select class="form-select" id="i-for"></select></div>
</div>
<div class="form-group"><label class="form-label">評価</label>
<div class="star-pick" id="i-stars">
<button type="button" class="star-btn" data-s="0">なし</button>
<button type="button" class="star-btn" data-s="1">★</button>
<button type="button" class="star-btn" data-s="2">★★</button>
<button type="button" class="star-btn" data-s="3">★★★</button>
</div></div>
<label class="check-row"><input type="checkbox" id="i-treasure"> たからもの（また買う）</label>
<div class="form-group"><label class="form-label">メモ（誰が喜んだか など）</label><textarea class="form-textarea" id="i-note"></textarea></div>
<div class="form-group"><label class="form-label">写真URL（1行に1つ・任意）</label><textarea class="form-textarea" id="i-photos"></textarea></div>
<button class="dq-button" id="btn-save-item" type="button" style="margin-top:8px">変更を保存する</button>
</div></div></div>
<div id="modal-detail" class="modal hidden">
<div class="modal-content">
<div class="modal-header"><span id="detail-title">場所の詳細</span><button class="modal-close" id="btn-close-detail" type="button">×</button></div>
<div class="modal-body" id="detail-body"></div>
</div></div>
<div id="modal-conquest" class="modal hidden">
<div class="modal-content">
<div class="modal-header"><span>🗺️ 制覇マップ</span><button class="modal-close" id="btn-close-conquest" type="button">×</button></div>
<div class="modal-body">
<div class="conquest-summary" style="margin-bottom:10px"><div><span class="big-num" id="cq-towns">0</span><span class="unit">町 制覇</span></div><div class="conquest-pref" id="cq-summary"></div></div>
<div class="tile-map" id="tile-map"></div>
<div class="mini-map-hint">色のついた都道府県を押すと、制覇した町の一覧が出ます。</div>
<div id="cq-detail"></div>
</div></div></div>
<div id="modal-celebration" class="modal hidden">
<div class="modal-content">
<div class="modal-body celeb-body">
<img class="king-img" src="assets/king_slime.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
<div class="king-emoji" style="display:none">👑🩵</div>
<div class="celeb-title" id="celeb-title">キングスライム あらわる！</div>
<div class="celeb-msg" id="celeb-msg"></div>
<button class="dq-button" id="btn-celeb-close" type="button" style="margin-top:14px">やったー！</button>
</div></div></div>
<div id="toast" class="toast"></div>
<script src="app.js?v=3"></script>
</body>
</html>
